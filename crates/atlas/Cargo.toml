[package]
name = "atlas"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = { version = "60.1.0", default-features = false }
arrow-schema = { version = "60.1.0", default-features = false }
cafebabe = "0.9.0"
clap = { version = "4.6.7", features = ["derive"] }
duckdb = { version = "1.20000.1", features = ["bundled"] }
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd"] }
rayon = "1.12.0"
zip = "9.4.0"
